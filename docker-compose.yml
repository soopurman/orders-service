services:
  api:
    build: .
    environment:
      SERVICE_NAME: orders-service
      DB_HOST: db
      DB_NAME: app
      DB_USER: appuser
      DB_PASSWORD: appsecret
    ports: ["8001:8000"]
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: appsecret
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d app"]
      interval: 3s
      timeout: 3s
      retries: 10
