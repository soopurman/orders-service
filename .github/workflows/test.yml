name: Service tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: docker compose up --build --detach
      - name: Wait for the containerized API
        run: curl --fail --retry 30 --retry-connrefused --retry-delay 2 http://localhost:8001/health
      - run: pip install -r requirements-test.txt && pytest -q tests
        env:
          API_BASE_URL: http://localhost:8001
      - if: always()
        run: docker compose down --volumes
